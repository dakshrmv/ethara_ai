<!DOCTYPE html>
<html>
<head>
    <title>Team Task Manager - Login</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="login-container">
        <h2>Team Task Manager</h2>
        <form id="login-form">
            <label>Username</label>
            <input type="text" id="username" class="form-control" required>
            
            <label>Password</label>
            <input type="password" id="password" class="form-control" required>
            
            <button type="submit" class="btn">Sign In</button>
            <p id="login-error" style="color: #dc3545; font-size: 14px; margin-top: 15px;"></p>
        </form>
        <div style="margin-top: 20px; font-size: 13px; color: #6c757d; border-top: 1px solid #eee; padding-top: 15px;">
            <p style="margin:0 0 5px 0;"><strong>Demo Accounts:</strong></p>
            <p style="margin:0;">Admin: admin / admin123</p>
            <p style="margin:0;">Member: member / member123</p>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
