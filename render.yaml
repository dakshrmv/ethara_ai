services:
  - type: web
    name: ethara-ai
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethara-db
          property: connectionString

databases:
  - name: ethara-db
    plan: free
    databaseName: etharadb
    user: ethara_user
